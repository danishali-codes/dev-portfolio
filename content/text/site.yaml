# Page titles and the text people see when the site is shared in a chat or found in search.
# Changes here show up in link previews after the next deploy (chat apps cache old previews for a while).

name: Danish Ali
# How every page title is built. {page} is the window or project name.
page-title: '{page} · Danish Ali'
home-title: Danish Ali · Dev portfolio
not-found: Not found

# The site-wide description, used for the desktop and most windows.
description: "Danish Ali's projects: Fuloos, Lockout and more, presented as a tiny operating system."
# Used once a window is open that has no description of its own.
window-description: Danish Ali, a developer in Dubai building apps, games and tools for his homelab.

# What search engines and link previews read for each address.
pages:
  home:
    description: Developer in Dubai building apps, games and tools for his homelab.
    # A plain version of the home page for search engines. Markdown works here.
    text: |-
      # Hi, I’m Danish.

      I build apps, games and tools for my homelab.

      [Selected work](/projects) · [About](/about) · [Contact](/contact)
    projects-heading: Projects
  projects:
    title: Selected work
    description: Apps, games and applied AI projects by Danish Ali.
  trash:
    title: Project archive
    description: Abandoned experiments and lessons from earlier projects.
  about: About
  contact: CV & contact
  now:
    title: Now
    description: 'What Danish is working on: this site, Lockout, and a Master of Applied AI at UOW Dubai.'
  uses:
    title: Uses
    description: Vite, React, TypeScript, Tailwind, PocketBase and Vercel, plus an NVIDIA RTX 4070 Ti for local training.
  resume:
    title: Resume
    description: Danish Ali, a developer in Dubai. Fuloos, Lockout and Ledger, plus how to get in touch.
  # For windows like Stats or Guestbook that have no description of their own.
  app-description: '{page} on Danish Ali’s interactive portfolio.'
  not-found-body: Nothing lives at this address. [Go to the desktop](/) or see [selected work](/projects).

# Shown only to people whose browser has JavaScript turned off. Markdown links work.
noscript: This site is a small desktop that needs JavaScript. Without it you can still read [selected work](/projects), [about me](/about) and my [resume](/resume), email [danishalidev@gmail.com](mailto:danishalidev@gmail.com), or find the code on [GitHub](https://github.com/danishali-codes).
